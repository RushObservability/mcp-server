[package]
name = "rush-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Model Context Protocol server for Rush Observability"
license = "MIT"
repository = "https://github.com/RushObservability/mcp-server"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
wiremock = "0.6"
rmcp = { version = "3.5.1", features = ["client"] }
