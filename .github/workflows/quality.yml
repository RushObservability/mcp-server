name: Rust quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # reviewed 2026-08-02
        with:
          # Pinned, not "stable": a new stable can add lints and turn this gate
          # red with no code change. Matches the other Rust repos in the org.
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Check formatting
        run: make fmt-check

      - name: Run Clippy
        run: make lint
