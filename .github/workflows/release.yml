name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Require the tag to match Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Release tag $TAG does not match package version $version. Expected v$version." >&2
            exit 1
          fi

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${TAG#v}"
          package="rush-mcp-$version-$TARGET"
          mkdir -p "dist/$package"
          cp "target/$TARGET/release/rush-mcp" README.md LICENSE "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $package = "rush-mcp-$version-$env:TARGET"
          New-Item -ItemType Directory -Path "dist/$package" -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/rush-mcp.exe", "README.md", "LICENSE" -Destination "dist/$package/"
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/$package.zip"

      - name: Upload packaged binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rush-mcp-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Publish release and assets
        shell: bash
        run: |
          release_flags=(--verify-tag --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG" --repo "$GH_REPO" "${release_flags[@]}" dist/*

  image:
    name: Publish container image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Build and push multi-arch image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          # arm64 builds run under QEMU emulation on the amd64 runner.
          docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install arm64
          docker buildx create --use --name rush-mcp
          tags=(--tag "$image:$version")
          if [[ "$TAG" != *-* ]]; then
            tags+=(--tag "$image:latest")
          fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            "${tags[@]}" --push .
